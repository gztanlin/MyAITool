<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的AI工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.6;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 40px; }
        .header h1 { font-size: 2.6rem; margin-bottom: 15px; font-weight: 700; }
        .header p { opacity: 0.95; font-size: 1.1rem; }
        
        .mode-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: white;
            padding: 8px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .mode-tab {
            flex: 1;
            padding: 14px 20px;
            text-align: center;
            background: transparent;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 15px;
            color: #666;
            border: none;
        }
        .mode-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102,126,234,0.4);
        }
        .mode-tab:not(.active):hover {
            background: #f0f0f0;
        }
        
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.3);
            padding: 35px;
        }
        
        .form-group { margin-bottom: 22px; }
        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 15px;
        }
        .form-group label .badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .form-group label .optional {
            background: #e2e8f0;
            color: #718096;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
            outline: none;
            font-family: inherit;
            line-height: 1.6;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.15);
        }
        
        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        .tip-box {
            background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%);
            border: 1px solid #667eea30;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 24px;
            font-size: 14px;
            color: #4a5568;
        }
        .tip-box .tip-title {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tip-box ul {
            margin: 0;
            padding-left: 20px;
        }
        .tip-box li {
            margin-bottom: 4px;
        }
        
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }
        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        .submit-btn:hover:not(:disabled)::before {
            left: 100%;
        }
        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(102,126,234,0.4);
        }
        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 30px;
        }
        .loading.show { display: block; }
        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid #e2e8f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading p {
            color: #667eea;
            font-weight: 500;
            font-size: 15px;
        }
        
        .result-container {
            display: none;
            margin-top: 25px;
            animation: fadeIn 0.3s ease;
        }
        .result-container.show { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
        }
        .result-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #1a202c;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .summary-content {
            line-height: 1.9;
            color: #4a5568;
            font-size: 15px;
            background: #f7fafc;
            padding: 22px;
            border-radius: 12px;
            white-space: pre-wrap;
            min-height: 150px;
            border: 1px solid #e2e8f0;
        }
        
        .error-message {
            display: none;
            background: #fff5f5;
            border: 1px solid #feb2b2;
            color: #c53030;
            padding: 14px;
            border-radius: 10px;
            margin-top: 18px;
            font-size: 14px;
            align-items: flex-start;
            gap: 10px;
        }
        .error-message.show { display: flex; }
        .error-message .icon { font-size: 18px; }
        
        .footer {
            text-align: center;
            color: #6b7280;
            margin-top: 35px;
            font-size: 13px;
            line-height: 1.8;
            padding: 20px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
        .footer .brand {
            font-weight: 600;
            margin-bottom: 4px;
            color: #4b5563;
        }
        
        .hidden { display: none !important; }
        
        @media (max-width: 768px) {
            .card { padding: 25px; }
            .header h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 我的AI工具</h1>
            <p>智能内容分析与 AI 问答助手</p>
        </div>

        <div class="mode-tabs">
            <button class="mode-tab active" id="tab-analyze" onclick="switchMode('analyze')">📝 内容分析</button>
            <button class="mode-tab" id="tab-chat" onclick="switchMode('chat')">💬 AI问答</button>
        </div>

        <div class="card">
            <input type="hidden" id="modeSelect" value="analyze">
            
            <div id="analyzeMode">
                <div class="tip-box">
                    <div class="tip-title">💡 内容分析可以做什么</div>
                    <ul>
                        <li>提取文章标题和核心要点</li>
                        <li>生成简洁摘要</li>
                        <li>分析新闻事件</li>
                        <li>总结产品介绍</li>
                        <li>提取关键数据和结论</li>
                    </ul>
                </div>

                <div class="form-group">
                    <label>
                        🌐 网页地址
                        <span class="badge">URL</span>
                    </label>
                    <input type="url" id="urlInput" placeholder="请输入网页地址，例如：https://example.com/article">
                </div>

                <div class="form-group">
                    <label>
                        📝 内容文本
                        <span class="optional">可选</span>
                    </label>
                    <textarea id="contentInput" placeholder="或者直接输入要分析的文本内容..."></textarea>
                </div>

                <div class="form-group">
                    <label>
                        🎯 分析要求
                        <span class="optional">可选</span>
                    </label>
                    <textarea id="promptInput" placeholder="请输入分析要求，例如：总结核心要点、提取关键数据等" style="min-height: 80px;"></textarea>
                </div>
            </div>

            <div id="chatMode" class="hidden">
                <div class="tip-box">
                    <div class="tip-title">💡 AI问答可以做什么</div>
                    <ul>
                        <li>解答各类问题</li>
                        <li>提供建议和方案</li>
                        <li>解释概念和原理</li>
                        <li>协助写作和创作</li>
                        <li>代码编写和调试</li>
                    </ul>
                </div>

                <div class="form-group">
                    <label>
                        💬 你的问题
                    </label>
                    <textarea id="questionInput" placeholder="请输入你想问的问题..." style="min-height: 150px;"></textarea>
                </div>
            </div>

            <button class="submit-btn" id="submitBtn">
                <span id="btnIcon">🚀</span>
                <span id="btnText">开始分析</span>
            </button>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p id="loadingText">AI 正在分析，请稍候...</p>
            </div>

            <div class="error-message" id="errorMessage">
                <span class="icon">❌</span>
                <span id="errorText"></span>
            </div>

            <div class="result-container" id="resultContainer">
                <div class="result-header">
                    <div class="result-title">
                        <span id="resultIcon">📊</span>
                        <span id="resultTitle">分析结果</span>
                    </div>
                </div>
                <div class="summary-content" id="summaryContent"></div>
            </div>
        </div>

        <div class="footer">
            <div class="brand">POWER BY TANLIN@2026</div>
            <div>AI 服务由通义千问提供</div>
        </div>
    </div>

    <script>
        const modeSelect = document.getElementById('modeSelect');
        const urlInput = document.getElementById('urlInput');
        const contentInput = document.getElementById('contentInput');
        const promptInput = document.getElementById('promptInput');
        const questionInput = document.getElementById('questionInput');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const loading = document.getElementById('loading');
        const loadingText = document.getElementById('loadingText');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const resultContainer = document.getElementById('resultContainer');
        const resultTitle = document.getElementById('resultTitle');
        const resultIcon = document.getElementById('resultIcon');
        const summaryContent = document.getElementById('summaryContent');
        const analyzeMode = document.getElementById('analyzeMode');
        const chatMode = document.getElementById('chatMode');
        const tabAnalyze = document.getElementById('tab-analyze');
        const tabChat = document.getElementById('tab-chat');

        function switchMode(mode) {
            modeSelect.value = mode;
            
            if (mode === 'chat') {
                analyzeMode.classList.add('hidden');
                chatMode.classList.remove('hidden');
                tabAnalyze.classList.remove('active');
                tabChat.classList.add('active');
                btnText.textContent = '提问';
                btnIcon.textContent = '💬';
                loadingText.textContent = 'AI 正在思考，请稍候...';
            } else {
                analyzeMode.classList.remove('hidden');
                chatMode.classList.add('hidden');
                tabAnalyze.classList.add('active');
                tabChat.classList.remove('active');
                btnText.textContent = '开始分析';
                btnIcon.textContent = '🚀';
                loadingText.textContent = 'AI 正在分析，请稍候...';
            }
            
            errorMessage.classList.remove('show');
            resultContainer.classList.remove('show');
        }

        async function analyze() {
            const mode = modeSelect.value;
            errorMessage.classList.remove('show');
            resultContainer.classList.remove('show');
            
            let requestData = { mode };

            if (mode === 'chat') {
                const question = questionInput.value.trim();
                if (!question) {
                    showError('请输入问题');
                    return;
                }
                requestData.question = question;
            } else {
                const url = urlInput.value.trim();
                const content = contentInput.value.trim();
                const prompt = promptInput.value.trim();

                if (!url && !content) {
                    showError('请输入网页地址或内容文本');
                    return;
                }

                if (url && content) {
                    showError('请只选择网页地址或内容文本，不要同时输入');
                    return;
                }

                requestData.url = url;
                requestData.content = content;
                requestData.prompt = prompt;
            }

            loading.classList.add('show');
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/summarize', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestData)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || '请求失败');
                }

                if (data.title === '错误') {
                    resultTitle.textContent = '错误';
                    resultIcon.textContent = '❌';
                    summaryContent.textContent = data.summary;
                } else {
                    resultTitle.textContent = mode === 'chat' ? 'AI 回答' : '分析结果';
                    resultIcon.textContent = mode === 'chat' ? '💬' : '📊';
                    summaryContent.textContent = data.summary;
                }
                resultContainer.classList.add('show');

            } catch (error) {
                showError(error.message);
            } finally {
                loading.classList.remove('show');
                submitBtn.disabled = false;
            }
        }

        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.add('show');
        }

        submitBtn.addEventListener('click', analyze);
        
        urlInput.addEventListener('keypress', (e) => { 
            if (e.key === 'Enter' && modeSelect.value === 'analyze') analyze(); 
        });
    </script>
</body>
</html>
