<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给我留言 - AI助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2rem;
            color: #1f2937;
            margin-bottom: 10px;
        }

        .header p {
            color: #6b7280;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
            font-size: 1rem;
        }

        .form-group textarea,
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s ease;
            background: #f9fafb;
        }

        .form-group textarea:focus,
        .form-group input:focus {
            outline: none;
            border-color: #3b82f6;
            background: white;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
        }

        .optional {
            color: #9ca3af;
            font-weight: 400;
            font-size: 0.875rem;
        }

        .submit-btn {
            width: 100%;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #6b7280;
        }

        .loading.show {
            display: flex;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e5e7eb;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            display: none;
            align-items: flex-start;
            gap: 10px;
            padding: 14px 16px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 10px;
            color: #dc2626;
            margin-bottom: 16px;
        }

        .error-message.show {
            display: flex;
        }

        .success-message {
            display: none;
            align-items: flex-start;
            gap: 10px;
            padding: 14px 16px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 10px;
            color: #16a34a;
            margin-bottom: 16px;
        }

        .success-message.show {
            display: flex;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #2563eb;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✉️ 给我留言</h1>
            <p>欢迎给我留言，我会尽快回复您！</p>
        </div>

        <form id="feedbackForm">
            <div class="form-group">
                <label>📝 您的留言</label>
                <textarea id="feedbackContent" placeholder="请输入您的留言、建议或问题..."></textarea>
            </div>
            <div class="form-group">
                <label>📧 您的邮箱 <span class="optional">可选</span></label>
                <input type="email" id="feedbackEmail" placeholder="方便我们回复您">
            </div>
            <div class="form-group">
                <label>📱 您的微信 <span class="optional">可选</span></label>
                <input type="text" id="feedbackWechat" placeholder="方便我们联系您">
            </div>

            <button type="submit" class="submit-btn" id="feedbackSubmitBtn">
                <span>📤</span>
                <span>提交留言</span>
            </button>
        </form>

        <div class="loading" id="feedbackLoading">
            <div class="spinner"></div>
            <p>正在提交，请稍候...</p>
        </div>

        <div class="error-message" id="feedbackErrorMessage">
            <span class="icon">❌</span>
            <span id="feedbackErrorText"></span>
        </div>

        <div class="success-message" id="feedbackSuccessMessage">
            <span class="icon">✅</span>
            <span>留言提交成功，感谢您的反馈！</span>
        </div>

        <a href="/" class="back-link">← 返回首页</a>
    </div>

    <script>
        const feedbackForm = document.getElementById('feedbackForm');
        const feedbackContent = document.getElementById('feedbackContent');
        const feedbackEmail = document.getElementById('feedbackEmail');
        const feedbackWechat = document.getElementById('feedbackWechat');
        const feedbackSubmitBtn = document.getElementById('feedbackSubmitBtn');
        const feedbackLoading = document.getElementById('feedbackLoading');
        const feedbackErrorMessage = document.getElementById('feedbackErrorMessage');
        const feedbackErrorText = document.getElementById('feedbackErrorText');
        const feedbackSuccessMessage = document.getElementById('feedbackSuccessMessage');

        function showFeedbackError(message) {
            feedbackErrorText.textContent = message;
            feedbackErrorMessage.classList.add('show');
            setTimeout(() => {
                feedbackErrorMessage.classList.remove('show');
            }, 5000);
        }

        async function submitFeedback(e) {
            e.preventDefault();
            
            const content = feedbackContent.value.trim();
            const email = feedbackEmail.value.trim();
            const wechat = feedbackWechat.value.trim();

            if (!content) {
                showFeedbackError('请输入留言内容');
                return;
            }

            feedbackSubmitBtn.disabled = true;
            feedbackLoading.classList.add('show');
            feedbackErrorMessage.classList.remove('show');
            feedbackSuccessMessage.classList.remove('show');

            try {
                const response = await fetch('/api/feedback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: content,
                        email: email,
                        wechat: wechat
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || '提交失败');
                }

                feedbackSuccessMessage.classList.add('show');
                feedbackContent.value = '';
                feedbackEmail.value = '';
                feedbackWechat.value = '';

            } catch (error) {
                showFeedbackError(error.message);
            } finally {
                feedbackLoading.classList.remove('show');
                feedbackSubmitBtn.disabled = false;
            }
        }

        feedbackForm.addEventListener('submit', submitFeedback);
    </script>
</body>
</html>
