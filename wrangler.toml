name = "my-ai-tool"
main = "server.js"
compatibility_date = "2024-01-01"

# 阿里云 ESA 配置说明：
# 1. 在 ESA 控制台创建 KV 存储空间（如 chat-store）
# 2. 在边缘函数配置环境变量 EDGEKV_NAMESPACE=chat-store
# 3. 函数代码中使用 EdgeKV API 访问存储

[dev]
port = 8787
local_protocol = "http"

[env.production]
name = "my-ai-tool-production"

[env.staging]
name = "my-ai-tool-staging"
