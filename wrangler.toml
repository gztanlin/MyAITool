name = "my-ai-tool"
main = "server.js"
compatibility_date = "2024-01-01"

# 开发环境配置
[dev]
port = 8787
local_protocol = "http"

# 生产环境配置
[env.production]
name = "my-ai-tool-production"
compatibility_date = "2024-01-01"

# 测试环境配置
[env.staging]
name = "my-ai-tool-staging"
compatibility_date = "2024-01-01"

# KV存储绑定（用于聊天室消息存储）
[[kv_namespaces]]
binding = "CHAT_KV"
id = "" # 需要在Cloudflare控制台获取
preview_id = "" # 需要在Cloudflare控制台获取